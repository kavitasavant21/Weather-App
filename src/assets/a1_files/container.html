  margin:0;
  padding:0;
  background:transparent;
  
  font-family: ui-sans-serif, system-ui, sans-serif;

  --text-m-font-size: 14px;
  --button-border-radius: 8px;
  --transition-speed-base: .1s;
  --logo-height: 32px;
}

#link {
  text-decoration: none;
  color: inherit;

  display: flex;
  flex-direction: column;
  width: 100%;

  will-change: filter;
  transition: filter var(--transition-speed-base) ease-in-out;

 
  background-color: var(--brandColor);
  
  &:hover {
    filter: brightness(0.96);
  }
}

#hero {
  width: 100%;
  aspect-ratio: 1;
  border: none;
}

#footer {
  display: flex;
  flex-direction: column;
  
  gap: 16px;
  
  .desktop & {   
    padding: 20px; 
  }
  .mobile & {   
    padding: 12px; 
  }
}

#infos {
  display: grid;
  grid-template-columns: max-content 1fr;
  align-items: center;
  
  gap: 16px;
  
  color: var(--taglineColor);
  
  & > :nth-child(even) {
    justify-self: right;
  }
}

#cta {
  color: var(--ctaColor);
  background-color: var(--ctaBackgroundColor);
  
  text-overflow: ellipsis;
  white-space: nowrap;
  overflow: hidden;
  
  --height-small: 32px;
  --vertical-border: 2px;
  --button-gradient-start: transparent 50%;
  --button-primary-gradient-background-color: rgba(255,255,255,.1);
  
  height: var(--height-small);
  font-size: var(--text-m-font-size);
  line-height: calc(var(--height-small) - var(--vertical-border));
  padding-inline: 11px;
  
  background-image: linear-gradient(
    to top,
    var(--button-gradient-start),
    var(--button-primary-gradient-background-color) 100%
  );
    

  cursor: pointer;
  white-space: nowrap;
  border-radius: var(--button-border-radius);
  transition: all var(--transition-speed-base)ease-in-out;
  text-align: center;
  -webkit-user-select: none;
  user-select: none;
  fill: currentColor;
  background-origin: border-box;
  border: 1px solid transparent;
  font-weight: 500;
  display: inline-block;
  
  box-sizing: border-box;
  padding: 0;
  text-decoration: none;
}

#tagline {
  line-height: 1.4;
  font-size: 12px;
  margin: 0;
  text-align: right;
}

#logo {
  max-width: 100%;
  max-height: var(--logo-height);

<script>
(() => {
  "use strict";

  /** Debounces with a leading activation. */
  const debounce = (fn, n) => {
    let timeout = undefined;
    return function (...args) {
      const isLeading = !timeout;
      clearTimeout(timeout);
      if (isLeading) fn.apply(this, args);
      timeout = setTimeout(() => {
        timeout = undefined;
        if (!isLeading) fn.apply(this, args);
      }, n);  
    }
  };

  const text = (v) => (v || "").trim();

  const color = (v, fb) => {
    const s = text(v);
    if (!s) return fb;

    if (/^[0-9A-F]{3}$|^[0-9A-F]{6}$|^[0-9A-F]{8}$/i.test(s)) return "#" + s;
    if (/^#[0-9A-F]{3}$|^#[0-9A-F]{6}$|^#[0-9A-F]{8}$/i.test(s)) return s;
    if (/^(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)(,(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)){2}$/.test(s)) return "rgb(" + s + ")";
    return fb;
  }

  const show = (el, on) => {
    if (!el) return;
    if (on) { el.removeAttribute("hidden"); } else { el.setAttribute("hidden", "hidden"); }
  }

  const raw = {
    image:        "https://tpc.googlesyndication.com/simgad/10974112110750065386?",
    logo:         "https://tpc.googlesyndication.com/simgad/12164413213850254853?",
    brandColor:   "25,27,30",
    tagline:      "Take your designs to the next level.",
    taglineColor: "255,255,255",
    ctaText:      "Learn more",
    ctaBg:        "75,159,144",
    ctaColor:     "255,255,255",
    pixel:        "",
    mobileBreakpoint: "767",
  };

  const mobileBreakpoint = parseInt(text(raw.mobileBreakpoint)) || 0;

  const FALLBACK = {
    brandColor:   "#111111",
    taglineColor: "#FFFFFF",
    ctaBg:        "#FFFFFF",
    ctaColor:     "#111111"
  };

  document.body.classList.add("desktop");

  if ("$sf" in window) {   
    const setViewportClass = () => {
      const win = $sf.ext.geom().win;
      if (win.w <= mobileBreakpoint) {
        document.body.classList.replace("desktop", "mobile");
      } else {
        document.body.classList.replace("mobile", "desktop");
      }
    }

    setViewportClass();

    $sf.ext.register(1,1, debounce((status, data) => {
      setViewportClass();
    }, 250));
  }

  const hero    = document.getElementById("hero");
  const panel   = document.getElementById("footer");
  const logo    = document.getElementById("logo");
  const tagline = document.getElementById("tagline");
  const cta     = document.getElementById("cta");

  const imageUrl = text(raw.image);
  if (/^https:\/\//i.test(imageUrl)) { hero.src = imageUrl; show(hero, true); }
  else { show(hero, false); }

  document.documentElement.style.setProperty("--brandColor", color(raw.brandColor, FALLBACK.brandColor));


  const logoUrl = text(raw.logo);
  if (logoUrl) { logo.src = logoUrl; show(logo, true); } else { show(logo, false); }

  const taglineText = text(raw.tagline);
  if (taglineText) {
    tagline.innerHTML = taglineText;
    document.documentElement.style.setProperty("--taglineColor", color(raw.taglineColor, FALLBACK.taglineColor));

    show(tagline, true);
  } else { show(tagline, false); }

  const ctaLabel = text(raw.ctaText);
  if (ctaLabel) {
    cta.textContent = ctaLabel;

    document.documentElement.style.setProperty("--ctaColor", color(raw.ctaColor, FALLBACK.ctaColor));
    document.documentElement.style.setProperty("--ctaBackgroundColor", color(raw.ctaBg, FALLBACK.ctaBg));

    show(cta, true);
  } else { show(cta, false); }

  if (!logoUrl && !taglineText && !ctaLabel) { panel.style.display = "none"; }

  const pixelUrl = text(raw.pixel);
  if (pixelUrl && /^https?:\/\//i.test(pixelUrl)) {
    const sep = pixelUrl.indexOf("?") === -1 ? "?" : "&";
    const px = new Image(1, 1);
    px.style.cssText = "position:absolute;width:1px;height:1px;border:0;left:-9999px;";
    px.alt = "";
    px.src = pixelUrl + sep + "cb=" + Math.floor(Math.random() * 1e13);
    document.body.appendChild(px);
  }
})();
